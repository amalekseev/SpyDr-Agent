[pytest]
markers =
    hierarchy: Tests for hierarchy and covenants functionality
    integration: Integration tests (e.g., KNCU)
    monitoring: Monitoring and alerting tests (e.g., TFM)
    margin_calc: Margin calculation tests
    account: Account-related tests
    crit_regress: Critical regression tests
    business_regress: Business regression tests
    single: Single/isolated tests
    ui: UI tests
    negative: Negative test cases
